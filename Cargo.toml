[workspace]
members = [
    "crates/lsystem-core",
    "crates/lsystem-renderer",
    "crates/lsystem-app-model",
    "crates/lsystem-app",
    "crates/lsystem-web-app",
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
console_error_panic_hook = "0.1"
gloo-file = "0.3"
gloo-timers = "0.3"
console_log = "1"
glam = "0.33"
iced = { git = "https://github.com/iced-rs/iced", rev = "51e9c2d06613efe42c591397c91769761640570d", default-features = false }
include_dir = "0.7"
js-sys = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.25.11", features = ["serde"] }
lsystem-core = { path = "crates/lsystem-core" }
lsystem-renderer = { path = "crates/lsystem-renderer" }
lsystem-app-model = { path = "crates/lsystem-app-model" }
thiserror = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1"
wgpu = { version = "29", features = ["webgl"] }
