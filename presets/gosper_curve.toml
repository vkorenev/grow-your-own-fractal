[metadata]
name = "Gosper Curve"

[l-system]
dimensions = 2
axiom = "XF"
iterations = 4

[l-system.rules]
X = "X+YF++YF-FX--FXFX-YF+"
Y = "-FX+YFYF++YF+FX--FX-Y"

[turtle]
angle = 60.0
step = 1.0
initial_heading = 0.0

[colors]
background = [0.0, 0.0, 0.0]

[colors.line]
mode = "hue_cycle"
initial = [0.9, 0.0, 0.0]
